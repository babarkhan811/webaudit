[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webaudit"
version = "0.1.0"
description = "Concurrent website health and compliance monitoring engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "cryptography>=42",
    "dnspython>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "rich>=13.7",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webaudit = "webaudit.cli:main"

[tool.setuptools.packages.find]
include = ["webaudit*"]

[tool.setuptools.package-data]
webaudit = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
